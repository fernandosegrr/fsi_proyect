   <g id="text_1">
    <text style="fill: #163c60; font: 700 8px 'DejaVu Sans'" transform="translate(64.39505 59.5178)">Teléfono Android</text>
    <text style="fill: #163c60; font: 700 8px 'DejaVu Sans'" transform="translate(49.684425 68.597625)">App LIDIA (Kotlin + JNI)</text>
    <text style="fill: #163c60; font: 700 8px 'DejaVu Sans'" transform="translate(39.256925 78.06785)">• Núcleo de navegación C99</text>
    <text style="fill: #163c60; font: 700 8px 'DejaVu Sans'" transform="translate(49.9413 87.210175)">• Visión YCbCr + TFLite</text>
    <text style="fill: #163c60; font: 700 8px 'DejaVu Sans'" transform="translate(48.5763 96.6804)">• Supervisión activa J16</text>
   </g>
   <g id="text_2">
    <text style="fill: #163c60; font: 700 8px 'DejaVu Sans'" transform="translate(270.335625 59.9082)">ESP32 DevKit (Carro)</text>
    <text style="fill: #163c60; font: 700 8px 'DejaVu Sans'" transform="translate(280.11125 68.988025)">AP WiFi CarroFSI</text>
    <text style="fill: #163c60; font: 700 8px 'DejaVu Sans'" transform="translate(270.2725 78.06785)">192.168.4.1 (:80 /ws)</text>
    <text style="fill: #163c60; font: 700 8px 'DejaVu Sans'" transform="translate(261.34875 87.147675)">• Cola 32 órdenes + WDT</text>
    <text style="fill: #163c60; font: 700 8px 'DejaVu Sans'" transform="translate(263.35875 96.2275)">• Lazo PI RUMBO y GIRO</text>
   </g>
   <g id="text_3">
    <text style="fill: #163c60; font: 700 8px 'DejaVu Sans'" transform="translate(476.379325 59.9082)">Freenove ESP32-WROVER</text>
    <text style="fill: #163c60; font: 700 8px 'DejaVu Sans'" transform="translate(484.489325 68.988025)">Cámara GC0308 (STA)</text>
    <text style="fill: #163c60; font: 700 8px 'DejaVu Sans'" transform="translate(507.028075 78.06785)">192.168.4.2</text>
    <text style="fill: #163c60; font: 700 8px 'DejaVu Sans'" transform="translate(468.8362 87.147675)">• HQVGA 240×176 @ 20 MHz</text>
    <text style="fill: #163c60; font: 700 8px 'DejaVu Sans'" transform="translate(471.87245 96.2275)">• HTTP :80/:81 y UDP :4210</text>
   </g>
   <g id="text_4">
    <text style="fill: #163c60; font: 7.8px 'DejaVu Sans'" transform="translate(278.603813 198.929468)">Sensores en bus I2C</text>
