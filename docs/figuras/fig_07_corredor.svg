   <g id="text_1">
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(53.934253 44.950905)">1. Clasificador de piso</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(46.476113 53.803734)">obstaculos.c (YCbCr/RGB)</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(40.5798 62.656564)">• Hasta 3 clústeres de suelo</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(49.664363 71.509393)">• Regla J10c en filas &lt; 7</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(49.723472 80.42316)">• Máscara de artefactos</text>
   </g>
   <g id="text_2">
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(43.262878 137.142127)">2. Red neuronal de objetos</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(35.862628 146.055894)">DetectorTflite + ModeloEnHilo</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(34.763316 154.908724)">• EfficientDet-Lite0 (90 clases)</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(34.064363 163.761553)">• Hilo propio (vigencia 300 ms)</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(49.109831 172.67532)">• Modo opcional obj-any</text>
   </g>
   <g id="text_3">
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(53.44005 229.455225)">3. Sensor láser frontal</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(37.960706 238.308054)">VL53L0X (tof.c / navegador.c)</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(43.529784 247.221821)">• Paro hardware a 120 mm</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(39.730331 256.074651)">• Autoridad opcional en ruta</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(40.345191 264.92748)">  a 400 mm (columnas 3 a 6)</text>
   </g>
   <g id="text_4">
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(258.605494 81.986767)">Corredor de perspectiva</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(289.875572 90.839597)">corredor.c</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(251.487994 100.073066)">Proyecta el ancho físico del</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(255.156431 108.986833)">carro (150 mm + margen)</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(267.0429 118.28124)">según la fila vertical</text>
   </g>
   <g id="text_5">
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(268.4859 191.648528)">Fusión sincronizada</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(269.334759 200.501357)">fusion.c + puente.c</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(258.9699 209.354186)">Protegida por mutex JNI</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(266.632181 218.267953)">candado_vision (J16)</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(254.819447 227.71836)">Combina color, red y láser</text>
   </g>
   <g id="text_6">
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(476.05335 122.458749)">Decisión del navegador</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(500.950584 131.372516)">navegador.c</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(466.49835 140.286283)">• LIBRE → sigue con RUMBO</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(456.28035 149.20005)">• FUERA DEL CORREDOR → avisa</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(461.384475 158.052879)">• EN EL CORREDOR → detiene,</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(468.026663 167.286349)">  evalúa lado libre (izq/der)</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(458.666053 176.139178)">  y ejecuta esquive en 3 tramos</text>
   </g>
