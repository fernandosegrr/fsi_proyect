  <g id="text_22">
   <text style="fill: #6c757d; font: 10px 'DejaVu Sans'; text-anchor: middle" x="432" y="49.308438" transform="rotate(-0 432 49.308438)">El cerebro siempre sabe en qué estado está; cada flecha es una regla del código, no una improvisación.</text>
