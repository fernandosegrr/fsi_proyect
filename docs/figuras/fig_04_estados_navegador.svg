   <g id="text_1">
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(46.932984 64.887622)">1. Planificar ruta</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(55.854234 73.740451)">trayectoria.c</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(42.131719 82.654218)">• Cuadrícula 20 cm</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(40.159172 91.507047)">• Convierte nodos a</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(47.636203 100.359877)">  pasos de giro y</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(49.360125 109.273643)">  avance en mm</text>
   </g>
   <g id="text_2">
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(203.184563 64.764942)">2. Guiar en recta</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(185.782031 73.924068)">RUMBO:&lt;décimas&gt; (J16)</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(186.222609 82.776897)">• Punto de mira 400 mm</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(187.554094 91.629727)">• Tope ±12° sobre recta</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(194.866594 100.482556)">• Suprime giros ≤ 8°</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(202.870125 109.396323)">• Lazo PI a 50 Hz</text>
   </g>
   <g id="text_3">
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(364.488469 64.887622)">3. Cerrar giros</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(347.672766 73.801388)">GIRO:&lt;grados&gt; + IMU</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(351.369234 82.715155)">• MPU6050 a 200 Hz</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(346.814156 91.567985)">• Escala en ppm (NVS)</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(350.850047 100.420814)">• Freno proporcional</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(346.817813 109.273643)">• Respaldo por tiempo</text>
   </g>
   <g id="text_4">
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(517.245891 64.558364)">4. Integrar pose</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(508.369734 73.472131)">rumbo_x10 (J15/J16)</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(509.230781 82.922538)">• Décimas de grado</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(511.107047 91.836305)">• Cuerda de pivote</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(522.851531 100.689134)">  2R·sin(Δθ/2)</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(505.336875 109.541963)">• Descarte dt en fallo</text>
   </g>
   <g id="text_5">
    <text style="fill: #163c60; font: 7.9px 'DejaVu Sans'" transform="translate(122.879789 213.60454)">Realimentación continua cada 100 ms (navegador_aportar_imu + navegador_aportar_tof + visión)</text>
    <text style="fill: #163c60; font: 7.9px 'DejaVu Sans'" transform="translate(89.544258 222.790586)">La pose integrada (x_mm, y_mm, rumbo_x10) corrige la referencia RUMBO en el siguiente ciclo sin detener el carro</text>
    <text style="fill: #163c60; font: 7.9px 'DejaVu Sans'" transform="translate(129.703414 232.362152)">y sirve de base geométrica para el esquive en 3 tramos si aparece un obstáculo en el corredor.</text>
   </g>
