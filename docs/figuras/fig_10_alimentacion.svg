   <g id="text_1">
    <text style="fill: #163c60; font: 700 7.9px 'DejaVu Sans'" transform="translate(50.566009 50.394179)">Powerbank USB #1</text>
    <text style="fill: #163c60; font: 700 7.9px 'DejaVu Sans'" transform="translate(38.442595 59.360506)">Salida 5 V por cable USB</text>
    <text style="fill: #163c60; font: 700 7.9px 'DejaVu Sans'" transform="translate(40.839134 68.326833)">(electrónica de control)</text>
   </g>
   <g id="text_2">
    <text style="fill: #163c60; font: 700 7.9px 'DejaVu Sans'" transform="translate(275.594894 50.33246)">ESP32 DevKit</text>
    <text style="fill: #163c60; font: 700 7.9px 'DejaVu Sans'" transform="translate(252.486159 59.298787)">Regulador interno 3.3 V</text>
    <text style="fill: #163c60; font: 700 7.9px 'DejaVu Sans'" transform="translate(256.071402 68.326833)">Control y red CarroFSI</text>
   </g>
   <g id="text_3">
    <text style="fill: #163c60; font: 7.8px 'DejaVu Sans'" transform="translate(491.027447 50.480083)">Sensores I2C (3.3 V)</text>
    <text style="fill: #163c60; font: 7.8px 'DejaVu Sans'" transform="translate(461.283244 59.332912)">MPU6050 (0x68) + VL53L0X (0x29)</text>
    <text style="fill: #163c60; font: 7.8px 'DejaVu Sans'" transform="translate(473.428697 68.185742)">SDA=GPIO 21 · SCL=GPIO 22</text>
   </g>
   <g id="text_4">
    <text style="fill: #163c60; font: 700 7.9px 'DejaVu Sans'" transform="translate(57.044627 150.104299)">Portapilas 4×AA</text>
    <text style="fill: #163c60; font: 700 7.9px 'DejaVu Sans'" transform="translate(35.251119 159.070626)">4.8 V (NiMH) a 6.0 V (alc.)</text>
    <text style="fill: #163c60; font: 700 7.9px 'DejaVu Sans'" transform="translate(45.986478 168.422473)">con interruptor físico</text>
   </g>
   <g id="text_5">
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(264.80055 150.382963)">Puente H TC1508A</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(250.416863 159.235792)">Entrada de potencia VDD</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(244.83255 168.088622)">IN1..IN4 (GPIO 27/26/25/33)</text>
   </g>
   <g id="text_6">
    <text style="fill: #163c60; font: 7.8px 'DejaVu Sans'" transform="translate(498.491072 150.382963)">4 Motores DC TT</text>
    <text style="fill: #163c60; font: 7.8px 'DejaVu Sans'" transform="translate(472.067353 159.235792)">2 canal izquierdo + 2 derecho</text>
    <text style="fill: #163c60; font: 7.8px 'DejaVu Sans'" transform="translate(480.200072 168.088622)">(sin unión con 5 V / 3.3 V)</text>
   </g>
   <g id="text_7">
    <text style="fill: #163c60; font: 700 7.9px 'DejaVu Sans'" transform="translate(50.566009 247.261619)">Powerbank USB #2</text>
    <text style="fill: #163c60; font: 700 7.9px 'DejaVu Sans'" transform="translate(37.38165 256.227946)">Salida 5 V independiente</text>
    <text style="fill: #163c60; font: 700 7.9px 'DejaVu Sans'" transform="translate(44.304642 265.194273)">(exclusiva de cámara)</text>
   </g>
   <g id="text_8">
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(249.705722 247.347523)">Freenove ESP32-WROVER</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(239.64555 256.200353)">Cámara GC0308 (192.168.4.2)</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(266.483644 265.053182)">Aislada del chasis</text>
   </g>
   <g id="text_9">
    <text style="fill: #b00020; font: 700 7.8px 'DejaVu Sans'" transform="translate(452.421403 247.252266)">Regla de protección eléctrica:</text>
    <text style="fill: #b00020; font: 700 7.8px 'DejaVu Sans'" transform="translate(437.959716 256.166032)">El positivo de las 4 pilas AA va SOLO</text>
    <text style="fill: #b00020; font: 700 7.8px 'DejaVu Sans'" transform="translate(433.970138 265.399502)">a VDD del TC1508A; jamás a la ESP32.</text>
   </g>
