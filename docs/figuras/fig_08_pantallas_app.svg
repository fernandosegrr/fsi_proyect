   <g id="text_1">
    <text style="fill: #163c60; font: 700 8.2px 'DejaVu Sans'; text-anchor: middle" x="323.82" y="44.821048" transform="rotate(-0 323.82 44.821048)">MainActivity — Contenedor principal con barra de estado y 4 pestañas</text>
   </g>
   <g id="text_2">
    <text style="fill: #163c60; font: 700 7.6px 'DejaVu Sans'" transform="translate(49.603688 112.042007)">Pestaña 1: Inicio</text>
    <text style="fill: #163c60; font: 700 7.6px 'DejaVu Sans'" transform="translate(34.367469 120.667841)">Estado de red CarroFSI,</text>
    <text style="fill: #163c60; font: 700 7.6px 'DejaVu Sans'" transform="translate(37.142063 129.293674)">video MJPEG, resumen</text>
    <text style="fill: #163c60; font: 700 7.6px 'DejaVu Sans'" transform="translate(38.983281 138.290388)">de sensores y batería</text>
   </g>
   <g id="text_3">
    <text style="fill: #163c60; font: 700 7.6px 'DejaVu Sans'" transform="translate(204.597969 112.042007)">Pestaña 2: Manual</text>
    <text style="fill: #163c60; font: 700 7.6px 'DejaVu Sans'" transform="translate(203.779781 120.667841)">Cruceta de mando,</text>
    <text style="fill: #163c60; font: 700 7.6px 'DejaVu Sans'" transform="translate(194.004875 129.293674)">perfiles MANUAL/AUTO,</text>
    <text style="fill: #163c60; font: 700 7.6px 'DejaVu Sans'" transform="translate(194.680563 138.290388)">giro por ángulo y PARO</text>
   </g>
   <g id="text_4">
    <text style="fill: #163c60; font: 700 7.6px 'DejaVu Sans'" transform="translate(366.977906 112.078226)">Pestaña 3: Rutas</text>
    <text style="fill: #163c60; font: 700 7.6px 'DejaVu Sans'" transform="translate(352.426281 120.704059)">Cuadrícula 20 cm, aviso</text>
    <text style="fill: #163c60; font: 700 7.6px 'DejaVu Sans'" transform="translate(360.321375 129.628336)">de calibración (J16),</text>
    <text style="fill: #163c60; font: 700 7.6px 'DejaVu Sans'" transform="translate(364.572031 138.254169)">ejecutar y simular</text>
   </g>
   <g id="text_5">
    <text style="fill: #163c60; font: 700 7.6px 'DejaVu Sans'" transform="translate(529.673719 112.012319)">Pestaña 4: Más</text>
    <text style="fill: #163c60; font: 700 7.6px 'DejaVu Sans'" transform="translate(517.874719 120.638153)">Ajustes, acceso a las</text>
    <text style="fill: #163c60; font: 700 7.6px 'DejaVu Sans'" transform="translate(513.764781 129.323362)">5 pantallas completas,</text>
    <text style="fill: #163c60; font: 700 7.6px 'DejaVu Sans'" transform="translate(528.52125 138.320076)">ayuda y versión</text>
   </g>
   <g id="text_6">
    <text style="fill: #163c60; font: 700 7.5px 'DejaVu Sans'" transform="translate(74.895586 201.25257)">5 Actividades de pantalla completa:  VisionActivity (modelo de piso y corredor)  ·  CalibracionActivity (avance ms/cm)</text>
    <text style="fill: #163c60; font: 700 7.5px 'DejaVu Sans'" transform="translate(43.239727 210.189499)">CalibrarGiroActivity (giro y cuerda)  ·  SensoresActivity (telemetría SENS, RUMBO y escala IMU en 3 pasos J16)  ·  BenchmarkActivity</text>
   </g>
   <g id="text_7">
    <text style="fill: #163c60; font: 700 7.5px 'DejaVu Sans'; text-anchor: middle" x="323.82" y="262.419834" transform="rotate(-0 323.82 262.419834)">Sesiones únicas compartidas (SesionCarro y SesionVideo): conservan vivo el WebSocket /ws y el flujo de cámara entre pantallas.</text>
   </g>
