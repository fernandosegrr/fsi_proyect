   <g id="text_1">
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(56.603766 63.689625)">App Android</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(50.739141 72.542454)">ControlLogica /</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(38.842922 81.456221)">ModoSemiautonomo</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(37.274391 90.309051)">• Latido cada 250 ms</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(40.288969 99.16188)">• PING cada 800 ms</text>
   </g>
   <g id="text_2">
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(199.998141 63.689625)">Enlace WebSocket</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(196.285219 72.542454)">ws://192.168.4.1/ws</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(198.688594 81.395284)">Cola de 32 ranuras</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(202.995047 90.248113)">• Prioridad STOP</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(192.671625 99.100943)">• Descarta PING viejo</text>
   </g>
   <g id="text_3">
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(355.457531 63.689625)">Lazo loop() en C99</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(351.687328 72.542454)">carro.c + sensores.c</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(350.547797 81.395284)">• Watchdog 1000 ms</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(347.2785 90.309051)">• Lazo PI RUMBO (J16)</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(352.776281 99.16188)">• Giro cerrado GIRO</text>
   </g>
   <g id="text_4">
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(521.997797 63.720094)">Tracción PWM</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(516.083813 72.572923)">TC1508A (1 kHz)</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(497.959172 81.425753)">• Arranque 255 (250 ms)</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(510.974203 90.278582)">• MANUAL 252/255</text>
    <text style="fill: #163c60; font: 700 7.8px 'DejaVu Sans'" transform="translate(505.86825 99.131411)">• AUTO 207/210 ± Δu</text>
   </g>
   <g id="text_5">
    <text style="fill: #163c60; font: 7.9px 'DejaVu Sans'" transform="translate(208.341125 210.42634)">Canal de retorno en tiempo real (ESP32 → App Android)</text>
    <text style="fill: #163c60; font: 7.9px 'DejaVu Sans'" transform="translate(87.435328 219.778188)">• SENS:&lt;ang_x10&gt;,&lt;mm&gt;,&lt;flags&gt; cada 100 ms en AUTO (décimas de grado + distancia láser + banderas bit 0..4)</text>
    <text style="fill: #163c60; font: 7.9px 'DejaVu Sans'" transform="translate(87.130437 229.349753)">• Avisos asíncronos de seguridad: WD:&lt;n&gt; (vencimiento de watchdog), TOF_PARO:&lt;mm&gt;, GIRO_FIN:&lt;ang&gt; y CAPS</text>
   </g>
