  <g id="text_7">
   <text style="fill: #1d3557; font: 700 18px 'DejaVu Sans'; text-anchor: middle" x="432" y="31.407187" transform="rotate(-0 432 31.407187)">Cómo se estima la pose</text>
  </g>
  <g id="text_8">
   <text style="fill: #6c757d; font: 10px 'DejaVu Sans'; text-anchor: middle" x="432" y="49.308438" transform="rotate(-0 432 49.308438)">El carro no tiene encoders ni GPS: la distancia sale del tiempo y la dirección, del giroscopio.</text>
  </g>
  <g id="text_9">
   <text style="fill: #6c757d; font: 8.2px 'DejaVu Sans'; text-anchor: middle" x="432" y="458.294688" transform="rotate(-0 432 458.294688)">Línea verde continua: camino real simulado.   Línea naranja discontinua: pose estimada.</text>
  </g>
  <g id="text_10">
   <text style="fill: #6c757d; font: 7.6px 'DejaVu Sans'; text-anchor: middle" x="432" y="473.516062" transform="rotate(-0 432 473.516062)">Concepto, no a escala. Cifras simuladas en docs/reporte_J15.md; la prueba física es NO MEDIDA.</text>
  </g>
