   <g id="text_1">
    <text style="fill: #163c60; font: 8px 'DejaVu Sans'" transform="translate(228.9875 44.972387)">Capa 1 — Operador humano y entorno físico</text>
    <text style="fill: #163c60; font: 8px 'DejaVu Sans'" transform="translate(127.19625 54.442612)">Supervisión visual directa, botón rojo PARO en pantalla e interruptor físico del portapilas 4×AA.</text>
   </g>
   <g id="text_2">
    <text style="fill: #163c60; font: 8px 'DejaVu Sans'" transform="translate(188.29125 108.617138)">Capa 2 — Supervisión activa en la aplicación Android (cierre J16)</text>
    <text style="fill: #163c60; font: 8px 'DejaVu Sans'" transform="translate(77.24375 118.087363)">Corta latido FORWARD si llega TOF_PARO; aborta ruta ante WD:&lt;n&gt;, silencio de SENS &gt; 1.5 s o freno láser no atendido.</text>
   </g>
   <g id="text_3">
    <text style="fill: #163c60; font: 8px 'DejaVu Sans'" transform="translate(197.43375 172.519588)">Capa 3 — Vigilancia temporal en el firmware (ESP32 DevKit)</text>
    <text style="fill: #163c60; font: 8px 'DejaVu Sans'" transform="translate(47.963125 181.599412)">Cola de 32 ranuras donde STOP/EBRAKE nunca se descartan; watchdog de 1000 ms (emite WD:&lt;n&gt;) y WDT de hardware de 5000 ms.</text>
   </g>
   <g id="text_4">
    <text style="fill: #163c60; font: 8px 'DejaVu Sans'" transform="translate(178.993125 236.324338)">Capa 4 — Paro reflejo de hardware por sensor láser frontal (VL53L0X)</text>
    <text style="fill: #163c60; font: 8px 'DejaVu Sans'" transform="translate(46.336875 245.404163)">En avance AUTO, si la distancia frontal cae por debajo de 120 mm, frena los motores en el propio ciclo local y emite TOF_PARO:&lt;mm&gt;.</text>
   </g>
