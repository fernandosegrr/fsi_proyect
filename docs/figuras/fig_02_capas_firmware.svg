   <g id="text_2">
    <text style="fill: #1d3557; font: 9.8px 'DejaVu Sans'" transform="translate(289.94635 177.986655)">firmware_carro.ino</text>
    <text style="fill: #1d3557; font: 9.8px 'DejaVu Sans'" transform="translate(238.549944 189.97772)">WiFi · HTTP · WebSocket · setup()/loop()</text>
   </g>
   <g id="text_3">
    <text style="fill: #1d3557; font: 9.8px 'DejaVu Sans'; text-anchor: middle" x="335.5776" y="253.966187" transform="rotate(-0 335.5776 253.966187)">carro.c · sensores.c · imu.c · tof.c · giro.c</text>
   </g>
   <g id="text_4">
    <text style="fill: #1d3557; font: 9.8px 'DejaVu Sans'" transform="translate(245.820319 321.842655)">firmware_carro.ino · funciones hw_...</text>
    <text style="fill: #1d3557; font: 9.8px 'DejaVu Sans'" transform="translate(248.770272 333.83372)">PWM · I2C · millis · NVS · keep-alive</text>
   </g>
   <g id="text_5">
    <text style="fill: #1d3557; font: 9.8px 'DejaVu Sans'; text-anchor: middle" x="335.5776" y="401.710188" transform="rotate(-0 335.5776 401.710188)">Hardware: motores, TC1508A, MPU6050, VL53L0X, WiFi</text>
   </g>
   <g id="text_6">
    <text style="fill: #6c757d; font: 7.4px 'DejaVu Sans'; text-anchor: end" x="311.472" y="148.23" transform="rotate(-0 311.472 148.23)">órdenes / estado</text>
   </g>
   <g id="text_7">
