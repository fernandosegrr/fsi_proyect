   </g>
   <g id="text_11">
    <text style="fill: #2d6a4f; font: 8px 'DejaVu Sans'" transform="translate(692.76355 296.54075)">La misma lógica</text>
    <text style="fill: #2d6a4f; font: 8px 'DejaVu Sans'" transform="translate(697.460425 306.410813)">corre en el PC</text>
    <text style="fill: #2d6a4f; font: 8px 'DejaVu Sans'" transform="translate(686.019175 316.280875)">con hardware falso.</text>
   </g>
   <g id="text_12">
    <text style="fill: #6c757d; font: 8.4px 'DejaVu Sans'; text-anchor: start" x="78.4512" y="436.139063" transform="rotate(-0 78.4512 436.139063)">El .ino no decide: solo traduce órdenes y sensores.</text>
   </g>
  </g>
  <g id="text_13">
   <text style="fill: #1d3557; font: 700 18px 'DejaVu Sans'; text-anchor: middle" x="432" y="30.687187" transform="rotate(-0 432 30.687187)">Capas del firmware</text>
  </g>
  <g id="text_14">
   <text style="fill: #6c757d; font: 10px 'DejaVu Sans'; text-anchor: middle" x="432" y="49.308438" transform="rotate(-0 432 49.308438)">La lógica en C no toca los pines: pide las cosas por funciones hw_... y así se puede probar en un PC.</text>
  </g>
  <g id="text_15">
   <text style="fill: #6c757d; font: 7.6px 'DejaVu Sans'; text-anchor: middle" x="432" y="473.727438" transform="rotate(-0 432 473.727438)">Esquema de capas, no a escala. Fuente: docs/referencia/firmware.md y carro.h.</text>
  </g>
