   </g>
   <g id="text_8">
    <text style="fill: #6c757d; font: 7.4px 'DejaVu Sans'; text-anchor: end" x="311.472" y="288.198" transform="rotate(-0 311.472 288.198)">hw_...</text>
   </g>
   <g id="text_9">
    <text style="fill: #6c757d; font: 7.4px 'DejaVu Sans'; text-anchor: end" x="311.472" y="362.07" transform="rotate(-0 311.472 362.07)">señales</text>
   </g>
   <g id="text_10">
    <text style="fill: #1d3557; font: 9px 'DejaVu Sans'" transform="translate(692.884097 240.588492)">Pruebas en PC</text>
